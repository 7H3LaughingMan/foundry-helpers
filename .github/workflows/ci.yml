name: Continuous Integration

on:
  push:
    branches:
      - v13
  pull_request:
    branches:
      - v13

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: "package.json"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install

      - name: Build/ESLint
        run: pnpm run tsc --noEmit && pnpm run eslint
